<!doctype html>
<meta charset="utf-8">
<title>Ami — Amazon support agent</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --txt:#e6e8ee;
          --dim:#9aa3b2; --accent:#ff9900; --ok:#4ade80; --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; background:var(--bg); color:var(--txt);
         font:14px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .col { display:flex; flex-direction:column; height:100vh; }
  #left { flex:1 1 55%; border-right:1px solid var(--line); }
  #right { flex:1 1 45%; background:var(--panel); }
  header { padding:12px 16px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:10px; }
  header b { color:var(--accent); }
  header span { color:var(--dim); font-size:12px; }
  button { margin-left:auto; background:#222733; color:var(--txt);
           border:1px solid var(--line); border-radius:6px; padding:5px 11px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #chat, #panel { flex:1; overflow-y:auto; padding:16px; }
  .msg { margin-bottom:14px; max-width:85%; }
  .msg.you { margin-left:auto; }
  .bubble { padding:9px 13px; border-radius:12px; white-space:pre-wrap; }
  .bubble strong { color:#fff; }
  /* Customer-facing record of what the agent DID. The chat text can be
     re-read or scrolled past; an action on someone's account should not
     depend on them noticing a sentence. */
  #activity { padding:0 16px; }
  #activity:not(:empty) { padding:12px 16px 4px; }
  .entry { display:flex; gap:9px; align-items:flex-start; border-radius:8px;
         padding:9px 12px; margin-bottom:8px; font-size:13px;
         border:1px solid var(--line); background:#12151c; }
  .entry .dot { width:7px; height:7px; border-radius:50%; margin-top:6px; flex:none; }
  .entry.done .dot { background:var(--ok); }
  .entry.esc  { border-color:#5b4a1f; background:#1c1710; }
  .entry.esc .dot { background:var(--accent); }
  .entry.lost { border-color:#5b2a2a; background:#1d1112; }
  .entry.lost .dot { background:#d03b3b; }
  .entry b { color:var(--txt); }
  .entry span { color:var(--dim); }
  .you .bubble { background:#2b3242; }
  .ami .bubble { background:#1d2230; border:1px solid var(--line); }
  .who { font-size:11px; color:var(--dim); margin-bottom:3px; }
  .you .who { text-align:right; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  input { flex:1; background:#12151c; color:var(--txt); border:1px solid var(--line);
          border-radius:8px; padding:10px 12px; font:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  h3 { margin:0 0 8px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
       color:var(--dim); }
  .step { border:1px solid var(--line); border-left:3px solid var(--accent);
          border-radius:6px; padding:9px 11px; margin-bottom:9px; background:#12151c; }
  .lbl { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  .step .lbl.act { color:#7dd3fc; } .step .lbl.obs { color:var(--dim); }
  code, pre { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  pre { margin:2px 0 8px; white-space:pre-wrap; word-break:break-word; color:var(--dim); }
  pre.ok { color:var(--ok); } pre.err { color:var(--err); }
  #wm { background:#12151c; border:1px solid var(--line); border-radius:6px;
        padding:11px; white-space:pre-wrap; color:var(--dim); font-size:12px; }
  .stats { display:flex; gap:14px; color:var(--dim); font-size:12px; margin:12px 0 6px; }
  .stats b { color:var(--txt); }
  .empty { color:var(--dim); font-style:italic; }
  .feedback-form { padding:12px 16px; border-top:1px solid var(--line); background:#12151c; }
  .feedback-form h4 { margin:0 0 12px; font-size:12px; letter-spacing:.08em;
                      text-transform:uppercase; color:var(--dim); }
  .feedback-form textarea { width:100%; background:#0f1115; color:var(--txt);
                            border:1px solid var(--line); border-radius:6px;
                            padding:10px 12px; font:inherit; font-size:12px;
                            margin-bottom:8px; resize:vertical; min-height:60px; }
  .feedback-form textarea:focus { outline:none; border-color:var(--accent); }
  .feedback-form-row { display:flex; gap:8px; margin-bottom:8px; }
  .feedback-form-row input { flex:1; }
  .feedback-submit { background:#1d2230; border:1px solid var(--line); color:var(--txt);
                     border-radius:6px; padding:8px 12px; cursor:pointer; font-size:12px; }
  .feedback-submit:hover { border-color:var(--accent); }
  .feedback-status { font-size:12px; color:var(--dim); margin-top:6px; }

  /* Per-reply feedback, like a production support chat. */
  .rate { display:flex; align-items:center; gap:6px; margin-top:4px; font-size:11px; color:var(--dim); }
  .rate button { margin:0; background:transparent; border:1px solid transparent; border-radius:6px;
                 padding:2px 6px; font-size:13px; line-height:1; cursor:pointer; color:var(--dim); }
  .rate button:hover { border-color:var(--line); }
  .rate button.on { border-color:var(--accent); }
  .rate .thanks { color:var(--ok); }
  .why { margin-top:6px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#12151c; }
  .why .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .why .chip { margin:0; font-size:12px; padding:4px 10px; border-radius:999px; background:#1d2230; }
  .why .chip.on { border-color:var(--accent); color:var(--txt); }
  .why textarea { width:100%; min-height:52px; resize:vertical; background:#0f1115; color:var(--txt);
                  border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; font-size:12px; }
  .why textarea:focus { outline:none; border-color:var(--accent); }
  .why .row { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .why .row button { margin:0; font-size:12px; }

  /* Agent internals panel: light theme. The chat stays dark; the panel that
     explains the agent reads like a document. Colours re-tuned for contrast on
     white (WCAG AA): darker green/red/blue/amber than the dark-theme values. */
  #right { --panel:#f6f7f9; --line:#d9dde4; --txt:#1b1f27; --dim:#5b6472;
           --ok:#15803d; --err:#b91c1c; --accent:#c2410c;
           background:var(--panel); color:var(--txt); color-scheme:light; }
  #right header b { color:#c2410c; }
  #right button { background:#ffffff; color:var(--txt); border-color:var(--line); }
  #right button:hover { border-color:#c2410c; }
  #right .step { background:#ffffff; border-color:var(--line); border-left-color:#ea7317; }
  #right .lbl { color:#b45309; }
  #right .step .lbl.act { color:#0369a1; }
  #right .step .lbl.obs { color:var(--dim); }
  #right pre { color:#334155; }
  #right pre.ok { color:#15803d; }
  #right pre.err { color:#b91c1c; }
  #right #wm { background:#ffffff; border-color:var(--line); color:#334155; }
  #right .stats b { color:var(--txt); }
  #right a { color:#0369a1; }
</style>

<div class="col" id="left">
  <header><b>Ami</b><span>Customer support</span>
    <button onclick="reset()">Reset session</button></header>
  <div id="activity"></div>
  <div id="chat"></div>
  <form onsubmit="send(event)">
    <input id="box" autocomplete="off" placeholder="Ask about an order…" autofocus>
    <button type="submit" style="margin:0">Send</button>
  </form>
</div>

<div class="col" id="right">
  <header><b>Agent internals</b><span>what it thought, what it remembers</span>
    <a href="/logs" target="_blank" style="margin-left:auto; color:var(--dim);
       text-decoration:none; border:1px solid var(--line); border-radius:6px;
       padding:5px 11px; font-size:12px">Logs &rarr;</a></header>
  <div id="panel">
    <h3>Last turn — plan trace</h3>
    <div id="steps" class="empty">No tools called yet.</div>
    <div class="stats">
      <div>conversation: <b id="nmsg">0</b> msgs</div>
      <div>orders known: <b id="nord">0</b></div>
      <div>ticket: <b id="tkt">—</b></div>
    </div>
    <h3>Working memory</h3>
    <div id="wm">(empty)</div>
    <h3 style="margin-top:14px">Long-term memory — this customer</h3>
    <div id="ltm" class="empty" style="font-size:12px">Not identified yet.</div>
  </div>
</div>

<script>
const GREETING = __GREETING__;
const $ = id => document.getElementById(id);

// The model writes **bold**. Escape everything first, THEN allow bold —
// never the other way round, or a customer could inject HTML.
function render(text) {
  const safe = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// ---- per-reply feedback ------------------------------------------------
let lastUserText = '';
const REASONS = [['wrong_info', 'Wrong information'], ['didnt_answer', "Didn't answer my question"],
                 ['not_helpful', 'Not helpful'], ['other', 'Other']];

async function sendRating(payload) {
  try {
    const r = await fetch('/feedback', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify(payload)});
    if (r.status === 401) return 'login';
    return (await r.json()).ok;
  } catch (e) { return false; }
}

function addRating(msgEl, replyText) {
  const asked = lastUserText;
  const row = document.createElement('div');
  row.className = 'rate';
  row.innerHTML = '<span>Helpful?</span><button title="Helpful" aria-label="Helpful">👍</button>' +
                  '<button title="Not helpful" aria-label="Not helpful">👎</button>';
  const [up, down] = row.querySelectorAll('button');
  const done = text => { row.innerHTML = '<span class="thanks"></span>'; row.firstChild.textContent = text; };
  up.onclick = async () => {
    up.classList.add('on');
    const ok = await sendRating({rating: 'up', original_response: replyText, user_message: asked});
    done(ok === 'login' ? 'Log in to leave feedback.' : ok ? 'Thanks for the feedback.' : "Couldn't save that, please try again.");
  };
  down.onclick = () => {
    if (msgEl.querySelector('.why')) return;
    down.classList.add('on');
    const box = document.createElement('div');
    box.className = 'why';
    box.innerHTML = '<div class="chips"></div><textarea placeholder="What should it have said? (optional)"></textarea>' +
                    '<div class="row"><button class="cancel">Cancel</button><button class="send">Send feedback</button></div>';
    let category = '';
    for (const [id, label] of REASONS) {
      const c = document.createElement('button');
      c.className = 'chip'; c.textContent = label;
      c.onclick = () => { category = id; box.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); };
      box.querySelector('.chips').append(c);
    }
    box.querySelector('.cancel').onclick = () => { box.remove(); down.classList.remove('on'); };
    box.querySelector('.send').onclick = async () => {
      const corrected = box.querySelector('textarea').value.trim();
      const label = (REASONS.find(r => r[0] === category) || [, ''])[1];
      const ok = await sendRating({rating: 'down', category: category || 'unspecified', reason: label,
                                   corrected_response: corrected, original_response: replyText, user_message: asked});
      box.remove();
      done(ok === 'login' ? 'Log in to leave feedback.' : ok ? 'Thanks, this helps us improve.' : "Couldn't save that, please try again.");
    };
    msgEl.append(box);
  };
  msgEl.append(row);
}

function bubble(who, text, rate) {
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'You' ? 'you' : 'ami');
  d.innerHTML = '<div class="who"></div><div class="bubble"></div>';
  d.querySelector('.who').textContent = who;
  d.querySelector('.bubble').innerHTML = render(text);
  if (rate) addRating(d, text);
  if (who === 'You') lastUserText = text;
  $('chat').append(d);
  $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}

// What the agent has done to this customer's account, shown to the customer.
function drawActivity(d) {
  const box = $('activity');
  box.innerHTML = '';
  for (const a of d.actions || []) {
    const esc = a.startsWith('Escalated');
    const el = document.createElement('div');
    el.className = 'entry ' + (esc ? 'esc' : 'done');
    el.innerHTML = '<div class="dot"></div><div></div>';
    const body = el.querySelector('div:last-child');
    if (esc) {
      body.innerHTML = '<b>Handed to a human agent</b> · ticket <b>' +
        (d.escalation || '') + '</b><br><span>They will email you within 24 hours.</span>';
    } else {
      body.innerHTML = '<b>Done</b> <span></span>';
      body.querySelector('span').textContent = '— ' + a;
    }
    box.append(el);
  }
}

function draw(d) {
  drawActivity(d);
  $('nmsg').textContent = d.messages;
  $('nord').textContent = d.orders;
  $('tkt').textContent = d.escalation || '—';
  $('wm').textContent = d.working;
  $('ltm').textContent = d.longterm || 'First conversation with this customer.';
  $('ltm').className = d.longterm ? '' : 'empty';

  const box = $('steps');
  box.className = '';
  if (!d.steps || !d.steps.length) {
    box.className = 'empty';
    box.textContent = 'No tools called this turn — answered from memory.';
    return;
  }
  box.innerHTML = '';
  for (const s of d.steps) {
    const err = 'error' in s.observation;
    const el = document.createElement('div');
    el.className = 'step';
    el.innerHTML =
      '<div class="lbl">Thought ' + s.n + '</div><pre class="th"></pre>' +
      '<div class="lbl act">Action</div><pre class="ac"></pre>' +
      '<div class="lbl obs">Observation</div>' +
      '<pre class="ob ' + (err ? 'err' : 'ok') + '"></pre>';
    el.querySelector('.th').textContent = s.thought;
    el.querySelector('.ac').textContent =
      s.tool + '(' + JSON.stringify(s.args).slice(1, -1) + ')';
    el.querySelector('.ob').textContent = JSON.stringify(s.observation, null, 1);
    box.append(el);
  }
}

async function send(e) {
  e.preventDefault();
  const text = $('box').value.trim();
  if (!text) return;
  $('box').value = '';
  bubble('You', text);
  const pending = bubble('Ami', 'thinking…');
  try {
    const r = await fetch('/chat', {method:'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message:text})});
    const d = await r.json();
    pending.querySelector('.bubble').innerHTML = render(d.reply);
    if (!d.requires_login && d.reply) addRating(pending, d.reply);

    // If login is required, add a login button
    if (d.requires_login) {
      console.log('LOGIN REQUIRED - Adding button. d =', d);
      const bubble = pending.querySelector('.bubble');
      const br = document.createElement('br');
      bubble.appendChild(br);
      const btn = document.createElement('button');
      btn.textContent = 'Log In Now';
      btn.style.marginTop = '12px';
      btn.style.background = '#ff9900';
      btn.style.color = '#000';
      btn.style.border = 'none';
      btn.style.borderRadius = '6px';
      btn.style.padding = '10px 16px';
      btn.style.cursor = 'pointer';
      btn.style.fontWeight = '600';
      btn.style.display = 'inline-block';
      btn.onclick = () => {
        console.log('Button clicked, navigating to /login');
        window.location.href = '/login';
      };
      bubble.appendChild(btn);
      console.log('Button successfully appended:', btn);
    } else {
      console.log('No login required. d.requires_login =', d.requires_login);
    }

    draw(d);
  } catch (err) {
    pending.querySelector('.bubble').textContent = 'Connection failed: ' + err;
  }
}


async function reset() {
  try {
    const r = await fetch('/reset', {method:'POST',
      headers: {'Content-Type': 'application/json'}, body:'{}'});
    if (!r.ok) {
      console.error('Reset failed:', r.status, r.statusText);
      return;
    }
    const d = await r.json();
    $('chat').innerHTML = '';
    $('activity').innerHTML = '';
    bubble('Ami', d.greeting || GREETING);
    draw({...d, steps: []});
    // The server expires the HttpOnly auth cookie in its response.
    document.cookie = 'sid=; Max-Age=0; path=/;';
  } catch (err) {
    console.error('Reset error:', err);
  }
}

// A reload must not show a clean slate over a session that is not clean.
// Ask the server what it holds for this browser before drawing anything.
// Auth cookie is sent automatically by browser
fetch('/state', {headers: {'Content-Type': 'application/json'}}).then(r => r.json()).then(d => {
  draw({...d, steps: []});
  if (d.stale) {
    // The server did not recognise this browser's session. Never pretend
    // that is a fresh chat — the customer can still see their old messages.
    bubble('Ami', GREETING);
    const el = document.createElement('div');
    el.className = 'entry lost';
    el.innerHTML = '<div class="dot"></div><div><b>Earlier conversation not found</b>'
                 + '<br><span>The server was restarted, so Ami no longer has this '
                 + 'chat\'s history. Anything above this line is not remembered.</span></div>';
    $('activity').append(el);
  } else if (d.messages > 0) {
    // Redraw conversation history from server state
    if (d.history && d.history.length > 0) {
      for (const msg of d.history) {
        bubble(msg.role === 'user' ? 'You' : 'Ami', msg.content, msg.role !== 'user');
      }
    }
  } else {
    // Fresh session or after reset — show the greeting (use dynamic greeting from state if available)
    bubble('Ami', d.greeting || GREETING);
  }
});
</script>
